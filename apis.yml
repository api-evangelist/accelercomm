aid: accelercomm
name: AccelerComm
description: 'AccelerComm Limited is a British semiconductor and wireless physical-layer IP
  company headquartered at Southampton Science Park, spun out of the University of Southampton
  in 2016 by Professor Rob Maunder. It designs and licenses channel-coding (forward error
  correction) intellectual property — LDPC and Polar encoders/decoders, CRC acceleration,
  rate matching, soft-decision demodulation, channel estimation and equalisation — delivered
  as RTL/FPGA IP cores, optimised software libraries and hardware-acceleration architectures
  for 5G NR and 4G LTE baseband. Its LEOphy product is a complete Split-6 RU High-PHY layer 1
  modem for low-earth-orbit 5G Non-Terrestrial Network satellite payloads, and the company was
  selected for the Airbus UpNext SpaceRAN software-defined-satellite demonstrator. AccelerComm
  raised £21.5m in growth funding, counts IP Group among its investors, and holds more than 56
  granted international patents. Its products are integrated by silicon and RAN vendors over
  hardware interfaces such as AXI rather than over the network: AccelerComm publishes no public
  API, developer portal, SDK or machine-readable contract, and its GitHub organisation carries
  no public repositories. The one machine-readable document it does serve is an /llms.txt at the
  root of its marketing site.'
